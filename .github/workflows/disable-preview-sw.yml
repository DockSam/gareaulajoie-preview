name: Disable preview service worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/disable-preview-sw.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove service worker registration and invalidate caches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('docs')
          for p in root.rglob('*.js'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              old = '"serviceWorker"in navigator&&window.addEventListener("load",()=>{navigator.serviceWorker.register("/gareaulajoie-preview/sw.js").catch(()=>{})});'
              if old in txt:
                  txt = txt.replace(old, '')
                  p.write_text(txt, encoding='utf-8')
          (root/'sw.js').write_text("self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil((async()=>{for(const k of await caches.keys()) await caches.delete(k); await self.registration.unregister(); const clientsList=await self.clients.matchAll({type:'window'}); for(const c of clientsList) c.navigate(c.url);})()));", encoding='utf-8')
          PY
      - name: Commit preview cache reset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Disable preview service worker and reset caches"
          git push
