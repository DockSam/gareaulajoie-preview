name: Repair LLM authority overlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-authority-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download clean authority overlay artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-90ac-81f7-b695-92a415bf8ad9/raw?se=2026-08-15T02%3A43%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=92d8962d-f669-5d39-a38a-6187a9cb4885&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A41%3A43Z&ske=2026-08-15T23%3A41%3A43Z&sks=b&skv=2026-02-06&sig=NT57npwaRBIgzoBlseW95XhQAfYeLh5TeNO6OudQ0uQ%3D' -o wrapper.zip
          rm -rf overlay
          mkdir overlay
          unzip -q wrapper.zip -d overlay
          test -f overlay/authority-preview-overlay.zip
          unzip -qo overlay/authority-preview-overlay.zip -d docs

      - name: Validate repaired LLM layer
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/llms.txt
          test -f docs/authority/index.html
          test -f docs/piliers/index.html
          test -f docs/answer-objects/index.html
          grep -q '<meta charset="utf-8"/>' docs/authority/index.html
          grep -q '/gareaulajoie-preview/authority-assets/partials.js' docs/authority/index.html
          ! grep -R -q '/gareaulajoie-preview/>' docs --include='*.html'
          grep -q 'Vetted Medical × Mila AI Safety Studio' docs/authority/index.html
          printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt
          touch docs/.nojekyll

      - name: Commit repaired authority layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git commit -m 'Repair LLM authority layer preview'
          git push
