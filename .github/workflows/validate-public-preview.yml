name: Validate public preview rendering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-public-preview.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docksam.github.io/gareaulajoie-preview/'
          for i in $(seq 1 12); do
            curl -fsSL "$URL?probe=$i" -o /tmp/page.html || true
            if grep -q 'index-4wJP4A-p.js' /tmp/page.html 2>/dev/null; then break; fi
            sleep 5
          done
          grep -q 'index-4wJP4A-p.js' /tmp/page.html
          curl -fI 'https://docksam.github.io/gareaulajoie-preview/assets/index-4wJP4A-p.js'
          curl -fI 'https://docksam.github.io/gareaulajoie-preview/assets/index-C5ea8VX-.css'
          curl -fI 'https://docksam.github.io/gareaulajoie-preview/images/hero-speaker.png'

      - name: Render with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "Using $CHROME"
          timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom 'https://docksam.github.io/gareaulajoie-preview/?headless=2' \
            > /tmp/rendered.html 2>/tmp/chrome.log || { cat /tmp/chrome.log; exit 1; }
          grep -Eqi 'IA Clinique|Adoption Responsable|1000\+|professionnels formés' /tmp/rendered.html || {
            echo 'Expected rendered hero text not found.'
            echo '--- Root snippet ---'
            grep -o '<div id="root"[^>]*>.*' /tmp/rendered.html | head -c 8000 || true
            echo '\n--- Chrome log ---'
            cat /tmp/chrome.log
            exit 1
          }
          echo 'Headless render OK'

# rerun after precise live-bundle rebuild
