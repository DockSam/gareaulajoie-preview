name: Materialize August 2026 preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-aug-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated merged artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-e900-822f-b96c-5a04e5b41026/raw?se=2026-08-14T15%3A33%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=000b2da5-0b35-5095-a4bc-500fdb81f578&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T13%3A00%3A15Z&ske=2026-08-15T13%3A00%3A15Z&sks=b&skv=2026-02-06&sig=QUYl1nKa2hBvoFMENAfN2b77akHoZQkpYuI/nLohkeo%3D' -o preview.zip
          rm -rf docs
          mkdir docs
          unzip -q preview.zip -d docs
          printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt
          touch docs/.nojekyll
          test -f docs/index.html
          test -f docs/en/index.html
          test -f docs/authority/index.html
          test -f docs/talks/st-marys-mcgill-grand-rounds-ai-primary-care-2026/index.html
          test -f docs/projects/vetted-mila-ai-safety-studio-mental-health-2026/index.html
          test -f docs/publications/profession-sante-debordement-estival-2026/index.html

      - name: Commit refreshed static preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "Refresh preview through August 2026"
          git push
